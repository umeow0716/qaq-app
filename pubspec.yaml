name: flutter_app
description: NTUT Life TAT, convenient, concise, fast, powerful, enrich your NTUT life!
publish_to: 'none'

# CHECK THE BUILD CODE BEFORE DISTRIBUTION!!
version: 1.6.9+5273

environment:
  flutter: ">=3.7.12 <4.0.0"
  sdk: ">=2.19.6 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.18.1
  path: ^1.8.2 # restricted by flutter sdk.
  path_provider: ^2.0.15
  provider: ^6.0.5
  url_launcher: ^6.1.11 # Dart 2.19 / Flutter 3.7 compatible.
  logger: ^2.0.2+1
  sprintf: ^7.0.0
  flutter_local_notifications: ^16.1.0
  rxdart: ^0.27.7
  video_player: ^2.7.2
  chewie: ^1.5.0
  html_unescape: ^2.0.0
  shared_preferences: ^2.2.2
  flutter_cache_manager: ^3.3.1
  dio: ^4.0.6 # restricted by feature. Upgrade pending for manually migration.
  dio_cookie_manager: ^2.0.0 # restricted by dio 4.0.6
  cookie_jar: ^3.0.1 # restricted by dio 4.0.6
  html: ^0.15.4
  github: ^9.19.0
  flutter_inappwebview: ^5.8.0
  eva_icons_flutter: ^3.1.0
  flutter_feather_icons: ^2.0.0+1
  json_annotation: ^4.8.1
  dart_big5: ^0.0.5
  flutter_widget_from_html_core: ^0.14.4
  flutter_staggered_animations: ^1.1.1
  mime_type: ^1.0.0
  get: ^4.6.5 # restricted by dart language version. (<3)
  bot_toast: ^4.1.3
  cached_network_image: ^3.2.3 # restricted by dart language version. (<3)
  auto_size_text: ^3.0.0
  table_calendar: ^3.0.9
  fluttertoast: ^8.2.2
  awesome_dialog: ^3.1.0
  flutter_slidable: ^3.0.0
  flutter_spinkit: ^5.2.0
  flutter_markdown: ^0.6.15 # restricted by dart language version. (<3)
  numberpicker: ^2.1.2
  open_filex: ^4.3.4


  meta: ^1.8.0 # restricted by flutter sdk.
  android_intent_plus: ^5.2.1
  package_info_plus: ^3.1.2

dependency_overrides:
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  dependency_validator: ^3.2.3
  flutter_launcher_icons: ^0.13.1 # Hosted; bump to >=0.14 after Dart 3 for monochrome generation.
  build_runner: ^2.3.3 # restricted by dart language version. (<3)
  json_serializable: ^6.6.2 # restricted by dart language version. (<3)
  flutter_lints: ^2.0.3 # restricted by dart language version. (<3)
  intl_utils: ^2.8.5
  flutter_native_splash: ^2.2.19 # restricted by path 1.8.2

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: TATFont
      fonts:
        - asset: assets/fonts/GenSenRounded-R.ttc
          weight: 400
        - asset: assets/fonts/GenSenRounded-B.ttc
          weight: 700

flutter_intl:
  # Because it will be repeatedly generated when it is turned on,
  # it is very troublesome, so we temporarily turn it off.
  # Run "flutter pub run intl_translation:extract_to_arb --output-dir=lib/l10n lib/l10n/intl_messages.dart" to generate it.
  enabled: false

flutter_launcher_icons:
  image_path: assets/images/original.png

  android: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/android.png # Android 8.0+ icons
  adaptive_icon_monochrome: assets/images/android.png # Re-enable generation with flutter_launcher_icons >=0.14 after Dart 3.

  ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.png
  branding: assets/images/branding.png

  color_dark: "#2b2b2b"
  image_dark: assets/images/splash-dark.png
  branding_dark: assets/images/branding-dark.png

  android_12:
    color: "#ffffff"
    image: assets/images/splash-android_12.png
    branding: assets/images/branding.png

    color_dark: "#2b2b2b"
    image_dark: assets/images/splash-android_12-dark.png
    branding_dark: assets/images/branding-dark.png

module:
  androidX: true
