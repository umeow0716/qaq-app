name: qaq_app
description: QAQ, an independent campus life assistant for NTUT students.
publish_to: 'none'

version: 1.7.0+5274

environment:
  flutter: ">=3.47.5 <4.0.0"
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  logger: ^2.7.0
  sprintf: ^7.0.0
  flutter_local_notifications: ^22.3.0
  rxdart: ^0.28.0
  video_player: ^2.14.0
  chewie: ^1.16.2
  html_unescape: ^2.0.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  flutter_cache_manager: ^3.4.2
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  html: ^0.15.7
  xml: ^7.0.1
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  github: ^9.26.0
  flutter_inappwebview: ^6.2.0-beta.3
  eva_icons_flutter: ^4.0.0
  lucide_icons_flutter: ^3.1.18
  json_annotation: ^4.12.0
  dart_big5: ^0.0.5
  flutter_widget_from_html_core: ^0.17.3
  flutter_staggered_animations: ^1.1.1
  mime: ^2.1.0
  get: ^4.7.3
  bot_toast: ^4.1.3
  cached_network_image: ^4.0.0
  auto_size_text: ^3.0.0
  table_calendar: ^3.2.1
  fluttertoast: ^10.0.0
  flutter_slidable: ^4.0.3
  flutter_spinkit: ^5.2.2
  flutter_markdown_plus: ^1.0.12
  numberpicker: ^2.1.2
  open_filex: ^4.7.0

  meta: ^1.19.0
  android_intent_plus: ^6.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  dependency_validator: ^5.0.6
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.16
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: QAQFont
      fonts:
        - asset: assets/fonts/GenSenRounded-R.ttc
          weight: 400
        - asset: assets/fonts/GenSenRounded-B.ttc
          weight: 700

flutter_intl:
  enabled: false

flutter_launcher_icons:
  image_path: assets/images/original.png

  android: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/android.png
  adaptive_icon_monochrome: assets/images/android.png

  ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.png

  color_dark: "#2b2b2b"
  image_dark: assets/images/splash-dark.png

  android_12:
    color: "#ffffff"
    image: assets/images/splash-android_12.png

    color_dark: "#2b2b2b"
    image_dark: assets/images/splash-android_12-dark.png

module:
  androidX: true
