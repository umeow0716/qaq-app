allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        subproject.android {
            compileSdk = 37

            if (namespace == null || namespace.isEmpty()) {
                def manifest = subproject.file("src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def xml = new groovy.xml.XmlSlurper().parse(manifest)
                    namespace = xml.@package.toString()
                }
            }
        }
    }
}

// CargoKit 0.18 parses the legacy SDK string as an integer. AGP 9.4 adds
// a minor component (android-37.0); keep that legacy getter compatible while
// leaving the typed compileSdk setting unchanged.
def appAndroid = project(':app').android
appAndroid.metaClass.getCompileSdkVersion = { -> "android-${appAndroid.compileSdk}" }

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}