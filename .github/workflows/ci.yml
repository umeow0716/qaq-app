name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: bash scripts/codegen.sh

      - name: Check formatting
        run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed -l 120

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android release lint
        run: |
          printf 'flutter.sdk=%s\n' "$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
          (cd android && ./gradlew :app:lintRealRelease -PskipDependencyChecks=true)

  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
